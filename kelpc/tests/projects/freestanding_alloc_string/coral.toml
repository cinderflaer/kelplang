name = "freestandingallocstring"

# Kernel stage 12's rejection fixture: an allocator is configured, so `String`
# is legal, but only the operations with a libc-free lowering are callable.
# `char_count` is not one of them, so the call is refused by name rather than
# left to fail at link.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
alloc = "alloc"
dealloc = "dealloc"

[unsafe]
modules = ["main"]
