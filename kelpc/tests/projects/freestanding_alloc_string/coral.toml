name = "freestandingallocstring"

# Kernel stage 7's rejection fixture: an allocator is configured, but `String`
# still reaches the hosted runtime's `strlen`/`memcpy`/`realloc`, so it stays
# refused. `List<String>` puts the refusal one level inside a container that the
# allocator would otherwise allow.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
alloc = "alloc"
dealloc = "dealloc"

[unsafe]
modules = ["main"]
