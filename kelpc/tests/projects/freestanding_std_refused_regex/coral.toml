name = "freestandingstdrefusedregex"

# `std/regex` is hosted-only: its `Match` and `RegexErr` carry a `String`, whose
# derived equality reaches the hosted runtime, and `View.slice`/`to_string` are
# runtime calls. The module is refused by name (plan/regex.md, Freestanding).
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
