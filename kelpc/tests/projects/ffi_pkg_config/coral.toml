name = "ffipkgconfig"

# MK9-S1-M1 (roadmap B-1): the `pkg_config` key names a package whose
# `pkg-config --cflags --libs` output reaches the generated C's compile and
# the link. The header below is found through the `-I` the fixture's own
# `kelptest.pc` supplies, not through `include_dirs`.
[extern."helper"]
domain = "env"
library = "c"
symbols = ["kelp_pkg_triple"]
header = "kelp_pkg_helper.h"
pkg_config = "kelptest"
