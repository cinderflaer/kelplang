name = "ffiaggregatedatac"

# User externs that take or return a datac by value (System V x86_64): the
# register and memory classes, with no Bytes or String. The native symbols come
# from the Rust witness in kelpc/tests/extern_aggregate.rs. No C source is compiled.
[extern."agg"]
domain = "process"
library = "kelpaggwit"
library_dirs = ["native"]
symbols = ["agg_pair_bump", "agg_mixed_bump", "agg_wide_bump", "agg_wide_total", "agg_trio_scale", "agg_tag_next"]
