name = "freestandingdefer"

# Kernel stage 6: the same bare-metal target as `freestanding_min`, with a
# `defer` in the image. The deferred action releases a static atomic lock flag,
# so the image needs no libc: the store is one atomic instruction and the
# linker has no undefined symbol to leave.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
