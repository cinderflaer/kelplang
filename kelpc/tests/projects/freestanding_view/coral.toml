name = "freestandingview"

# Kernel stage 23: the `View` surface in a freestanding build with no
# allocator. A view is a borrowed `{ptr, len}` pair with no storage of its own,
# so `len`/`get`/`slice`/`eq` are legal as soon as the compiler lowers their
# bodies; `View.to_string` is the one that allocates and still needs the
# `[target] alloc`/`dealloc` pair.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
