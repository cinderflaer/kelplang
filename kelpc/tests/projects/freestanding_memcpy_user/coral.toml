name = "freestanding_memcpy_user"

# Kernel gap 4's weak-linkage fixture: the same 4 KiB aggregate copies as
# `freestanding_memcpy`, with the project's own strong `memcpy` in
# `user_memcpy.s`. The test assembles that file for the same triple with
# `llvm-mc` and relinks the project's object beside it, so the link has to pick
# the project's definition over the compiler's weak fallback
# (`kelp wiki page language/freestanding.md`).
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
