name = "kernel0-percpu"

# Kernel stage 8 (MK9-S3-M3): per-CPU storage. `cpus = 2` makes the `percpu`
# static in `src/main.kp` two copies; `main` is on the audit list because it
# writes one, and `uart` because every device access is a raw pointer store.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"
cpus = 2

[unsafe]
modules = ["main", "uart"]

# Kernel stage 16's mmio grant: the NS16550's register window, held by the
# entry module and delegated to `uart`, the one module that builds a pointer
# from the device's address (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["0x10000000+0x100"]
