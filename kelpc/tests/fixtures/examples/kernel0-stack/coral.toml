name = "kernel0_stack"

# Kernel stage 14 (MK9-S7-M2), the stack half: a bare-metal riscv64 image whose
# kernel stack sits directly above an unmapped guard page, with a trap handler
# on its own stack. `main` builds the tables and the recursion, `trap` owns
# `stvec` and the naked handler, `uart` is the device register, and `vm` is the
# walker copied from `examples/kernel0-vm`.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "trap", "uart", "vm"]

# Kernel stage 16's mmio grant. `uart` names the NS16550 at a compile-time
# constant, so it gets exactly that window. `trap` and `vm` turn computed
# addresses (a trap-frame slot, a page-table frame) into pointers, which the
# compiler cannot fold, so they need the whole-address-space wildcard - the
# escape hatch a reviewer greps for (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["*"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "riscv64"
expect = ["stack: m-mode", "stack: paging on", "stack: phase t", "stack: stval in guard", "stack: phase a", "stack: stval in guard", "stack: phase b", "stack: stval in guard", "stack: halted"]
