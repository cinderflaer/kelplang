name = "polyp_bench"
entry = "src/main.kp"

# The benchmark owns its framebuffer through the headless platform and draws through the raster, so
# those three modules are the audited ones. `std/time` needs the `time` domain, which the entry
# `main` holds implicitly.
[unsafe]
modules = ["deps/polyp/backends/soft/soft/fb", "deps/polyp/backends/soft/soft/draw", "deps/polyp/backends/soft/soft/headless_platform"]
