name = "kernel0_vm"

# Kernel stage 10, the address-space half: the same bare-metal riscv64 image as
# kernel 0, with Sv39 page tables and a drop from machine mode to supervisor
# mode. `main`, `uart` and `vm` are all on the audit list: `main` writes the
# `satp`/`mstatus`/`pmp*` CSRs and the `ROOT` static, `uart` is the device
# register, and `vm` is the page-table walker and the frame allocator.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "uart", "vm"]

# Kernel stage 16's mmio grant. `uart` names the NS16550 at a compile-time
# constant, so it gets exactly that window. `main` and `vm` turn computed
# addresses (a mapped page, a page-table frame) into pointers, which the
# compiler cannot fold, so they need the whole-address-space wildcard - the
# escape hatch a reviewer greps for (`language/capabilities.md` (kelp wiki)).
# `frames` is the same wildcard, for the owner: `main` claims the root table and
# `vm` every mapped frame, and both are computed addresses from the frame region,
# so the claim needs `["*"]`. A `[caps]` section that names a domain is the only
# way the entry holds it, so `frames` is written here as well as delegated. What
# keeps a mapping inside the owner's range is the run-time check in `Space`, not
# the grant.
[caps]
mmio = ["*"]
frames = ["*"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "riscv64"
expect = ["vm: m-mode", "vm: root", "vm: identity", "vm: uart page", "vm: high page", "vm: s-mode", "vm: paging on", "vm: alias ok", "vm: unmap ok", "vm: align refused", "vm: range refused"]
