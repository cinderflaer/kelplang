name = "kernel0_aarch64"

# Kernel stage 10, "kernel 0 on a second architecture": a bare-metal aarch64
# image QEMU's `virt` machine boots, which writes a line to the PL011 UART and
# halts. `mode`, `triple`, `entry` and `linker_script` are stage 4's `[target]`
# section (`language/freestanding.md` (kelp wiki)); `panic` routes the compiler's own overflow
# and bounds checks to `kp_panic` in the entry module instead of the generated
# infinite loop, so a fault prints something before it wedges.
[target]
mode = "freestanding"
triple = "aarch64-unknown-none"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

# The audit list (stage 1, `language/unsafe.md` (kelp wiki)): only `uart` contains
# `unsafe`, and that is the one module that talks to the device register.
[unsafe]
modules = ["uart"]

# Kernel stage 16's mmio grant: the PL011 register window on QEMU's aarch64
# `virt` machine, held by the entry module and delegated to `uart`, the one
# module that builds a pointer from the device's address
# (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["0x09000000+0x1000"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "aarch64"
expect = ["hello from kelp (aarch64)"]
