name = "kernel0-statics"

# Kernel stage 7: the same boot as kernel 0, with the two things a `static`
# adds. `COUNTER` is a `static mut` the kernel bumps three times in `unsafe`,
# which is what puts `main` on the audit list beside `uart`; `LABEL` is an
# immutable static the same `unsafe` module reads as a plain table. Both are
# one object with a stable address, and the counter starts in `.bss` (QEMU's
# ELF loader zeroes it) where a folded `const` could not be.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "uart"]

# Kernel stage 16's mmio grant: the NS16550's register window, held by the
# entry module and delegated to `uart`, the one module that builds a pointer
# from the device's address (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["0x10000000+0x100"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "riscv64"
expect = ["counter 3"]
