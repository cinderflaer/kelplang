name = "kernel0_bss"

# Kernel stage 6, "kernel 0": a bare-metal riscv64 image QEMU's `virt` machine
# boots, which writes a line to the NS16550 UART and halts. `mode`, `triple`,
# `entry` and `linker_script` are stage 4's `[target]` section
# (`language/freestanding.md` (kelp wiki)); `panic` routes the compiler's own overflow and
# bounds checks to `kp_panic` in the entry module instead of the generated
# infinite loop, so a fault prints something before it wedges.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

# The audit list (stage 1, `language/unsafe.md` (kelp wiki)): `uart` is the module
# that talks to the device register, and `main` is the module whose inline asm
# takes the marker's address.
[unsafe]
modules = ["main", "uart"]

# Kernel stage 16's mmio grant. `uart` names the NS16550 at a compile-time
# constant, so it gets exactly that window. `main` takes the BSS marker's
# address from inline asm, which the compiler cannot fold, so it needs the
# whole-address-space wildcard - the escape hatch a reviewer greps for
# (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["*"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "riscv64"
expect = ["bss clear"]
