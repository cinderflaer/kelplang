name = "kernel0_vm_fault"

# Kernel stage 10, the fault half: the Sv39 kernel takes a load page fault and
# a store page fault on purpose and prints both from an S-mode trap handler.
# `main` writes the CSRs and the `ROOT` static, `trap` owns `stvec` and the
# naked handler, `uart` is the device register, and `vm` is the walker.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "trap", "uart", "vm"]

# Kernel stage 16's mmio grant. `uart` names the NS16550 at a compile-time
# constant, so it gets exactly that window. `trap` and `vm` turn computed
# addresses (the faulting instruction's `sepc`, a page-table frame) into
# pointers, which the compiler cannot fold, so they need the
# whole-address-space wildcard - the escape hatch a reviewer greps for
# (`language/capabilities.md` (kelp wiki)).
[caps]
mmio = ["*"]

# The boot table `kelpc boot` reads (issue #303): the QEMU machine and the serial
# lines this example must print. It replaces the run.sh that used to sit beside it.
[run]
qemu = "riscv64"
expect = ["fault: m-mode", "fault: paging on", "fault: scause 0xd stval 0x40000000", "fault: scause 0xf stval 0x3ffffff000"]
