name = "kernel0_trap"

# Kernel stage 6, the trap half: the same bare-metal riscv64 image, but `kmain`
# installs a trap vector with `csrw mtvec` and takes a machine-mode `ecall`.
# `main` joins `uart` in the audit list because the vector installation and the
# `ecall` are inline asm (stage 5, `plan/inline-asm.md`).
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "trap", "uart"]

# Kernel stage 16's mmio grant: the NS16550's register window, held by the
# entry module and delegated to `uart`, the one module that builds a pointer
# from the device's address (`plan/device-caps.md`).
[caps]
mmio = ["0x10000000+0x100"]
