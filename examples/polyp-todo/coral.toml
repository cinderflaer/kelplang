name = "polyp_todo"
entry = "src/main.kp"

# Everything from here down is pasted from examples/polyp/README.md: Kelp has no
# manifest for a library, so the consumer carries the library's `[extern.*]`
# sections itself. The module ids are the `impl` paths the library uses, which
# is the directory Coral-style dependencies reach it by (`src/deps/polyp/`).
#
# `ui` is the display domain (plan/ffi-display-domain.md): a GTK call names no
# display argument, so the only grant the domain takes is the wildcard. The
# library's `core.kp` and `headless_backend.kp` are pure Kelp and need no
# section; `gtk_backend.kp` is the one module that calls the binding.

[extern."deps/polyp/backends/gtk/gtk"]
domain = "ui"
library = "gtk-4"
header = "gtk/gtk.h"
pkg_config = "gtk4"
symbols = ["gtk_init", "gtk_window_new", "gtk_window_set_title", "gtk_window_set_default_size", "gtk_window_set_child", "gtk_window_present", "gtk_window_get_focus", "gtk_window_set_focus", "gtk_box_new", "gtk_box_append", "gtk_box_remove", "gtk_box_insert_child_after", "gtk_box_reorder_child_after", "gtk_box_set_spacing", "gtk_label_new", "gtk_label_set_markup", "gtk_widget_set_size_request", "gtk_entry_new", "gtk_editable_set_text", "gtk_editable_get_text", "gtk_button_new_with_label", "gtk_button_set_label", "gtk_check_button_new_with_label", "gtk_check_button_set_label", "gtk_check_button_set_active", "gtk_progress_bar_new", "gtk_progress_bar_set_fraction", "gtk_separator_new", "gtk_scrolled_window_new", "gtk_scrolled_window_set_child", "gtk_scrolled_window_get_child", "gtk_window_get_child", "gtk_widget_get_first_child", "gtk_widget_get_next_sibling", "gtk_widget_set_margin_start", "gtk_widget_set_margin_end", "gtk_widget_set_margin_top", "gtk_widget_set_margin_bottom", "gtk_widget_set_hexpand", "gtk_widget_set_vexpand", "gtk_widget_set_halign", "gtk_widget_set_valign", "gtk_widget_add_css_class", "gtk_widget_remove_css_class", "gtk_css_provider_new", "gtk_css_provider_load_from_string", "gdk_display_get_default", "gtk_style_context_add_provider_for_display", "gtk_widget_is_ancestor", "g_object_unref", "g_main_context_iteration", "g_timeout_add_full", "connect=g_signal_connect_data", "connect_ret=g_signal_connect_data", "g_signal_handler_block", "g_signal_handler_unblock"]

# The queue is pure Kelp now (no C header). Its ring is `static mut`, so the
# queue module is the one module that takes the `unsafe` grant.
[unsafe]
modules = ["deps/polyp/backends/gtk/queue"]
