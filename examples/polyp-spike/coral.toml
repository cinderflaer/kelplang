name = "polyp_spike"

# A stand-in capability domain, not a real one: a window is authority over a
# display server, which is none of the six domains v1 has. `process` is the
# closest of them and this is a compile-only spike; the decision is gap 6 of
# plan/user-ffi-gap-analysis.md, with the options in plan/ffi-display-domain.md.
#
# The GTK module. All three of `library`, `header` and `pkg_config` are
# load-bearing: the header makes the real prototypes visible to the generated
# C, `pkg_config` supplies GTK's include and library search paths, and
# `library` is the -l the manifest itself names. `g_strsplit`/`g_strfreev` come
# in through the same header (GLib, reached through GTK).
[extern."gtk"]
domain = "process"
library = "gtk-4"
header = "gtk/gtk.h"
pkg_config = "gtk4"
symbols = ["gtk_application_new", "gtk_application_window_new", "gtk_window_set_title", "gtk_window_present", "gtk_button_new_with_label", "gtk_window_set_child", "g_application_run", "g_object_unref", "application_unref=g_object_unref", "g_strsplit", "g_strfreev"]

# The one thing a generated call cannot spell: GTK's own `g_signal_connect` is
# a macro that casts its handler to `GCallback` and its destroy notify to
# `GClosureNotify`, and the generated `move closure(...)` expansion does not.
# This project-local `static inline` carries those two casts, taking the
# `(thunk, env, destroy)` triple the expansion emits and calling
# `g_signal_connect_data` with it. `include_dirs` is what lets the generated C
# find it, the same way `kelpc/tests/projects/ffi_callback` does.
[extern."seam"]
domain = "process"
library = "c"
header = "kelp_gtk_seam.h"
include_dirs = ["include"]
symbols = ["connect_clicked=kelp_gtk_connect_clicked"]
