name = "polyp_spike"

# A ui-domain module: a window is authority over a display server, which gap 6
# of plan/user-ffi-gap-analysis.md gave its own domain. The pattern vocabulary
# is the wildcard alone, because a GTK call carries no argument that names the
# display (plan/ffi-display-domain.md), which is what main.kp grants.
#
# The GTK module. All three of `library`, `header` and `pkg_config` are
# load-bearing: the header makes the real prototypes visible to the generated
# C, `pkg_config` supplies GTK's include and library search paths, and
# `library` is the -l the manifest itself names. `g_strsplit`/`g_strfreev` come
# in through the same header (GLib, reached through GTK).
[extern."gtk"]
domain = "ui"
library = "gtk-4"
header = "gtk/gtk.h"
pkg_config = "gtk4"
symbols = ["gtk_application_new", "gtk_application_window_new", "gtk_window_set_title", "gtk_window_present", "gtk_button_new_with_label", "gtk_window_set_child", "g_application_run", "g_object_unref", "g_main_context_iteration", "g_strsplit", "g_strfreev", "connect=g_signal_connect_data"]
