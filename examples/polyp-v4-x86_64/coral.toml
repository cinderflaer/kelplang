name = "polyp-v4-x86_64"

# Polyp v4: the same core, software raster, soft backend and todo program as
# `examples/polyp-fb-riscv64`, built with no libc for QEMU's x86-64 `-kernel` boot (an ELF64 image
# entered through the Xen PVH note and the compiler's long-mode stub, `kelp wiki page language/kernel.md`). The
# framebuffer platform is the same source file the riscv64 project compiles, so the only difference
# between the two images is the driver that writes the step lines.
[target]
mode = "freestanding"
triple = "x86_64-unknown-none"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"
alloc = "alloc"
dealloc = "dealloc"

# The audit list: the COM1 driver, the framebuffer platform (it takes a pointer to the static
# surface) and the two raster modules that write pixels. There is no `[caps]` `mmio` grant: a COM1
# byte moves through the `in`/`out` instructions, not through a `Ptr.from_addr`.
[unsafe]
modules = ["main", "uart", "fb_platform", "deps/polyp/backends/soft/soft/fb", "deps/polyp/backends/soft/soft/draw"]
