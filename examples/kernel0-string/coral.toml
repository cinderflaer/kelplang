name = "kernel0-string"

# Kernel stage 12: `String` and `Bytes` on the project allocator. The manifest
# is kernel 0's with the same allocator hook as `kernel0-heap`, plus a naming
# `realloc` so buffer growth takes the fast path. `main` is on the audit list
# because the allocator writes a `static mut` arena and reads a `Ptr<u8>`.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"
alloc = "alloc"
dealloc = "dealloc"
realloc = "realloc"

[unsafe]
modules = ["main", "uart"]
