name = "kernel0_user"

# Kernel stage 11: the same bare-metal riscv64 image as kernel0-vm, plus a trap
# frame, a drop to U-mode, an `ecall` syscall ABI and the untrusted-pointer
# check that guards it (`plan/syscall-abi.md`). `main` writes the CSRs, the
# `KERNEL_ROOT` static and the page tables; `trap` owns `stvec`, the naked
# entry and the frame; `syscall` copies from a user pointer through a kernel
# buffer; `user` holds the two hand-written programs; `uart` is the device
# register; `vm` is the walker, the frame allocator and the user-page check.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

[unsafe]
modules = ["main", "syscall", "trap", "uart", "user", "vm"]
