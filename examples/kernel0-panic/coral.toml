name = "kernel0-panic"

# Kernel stage 6, "kernel 0": a bare-metal riscv64 image QEMU's `virt` machine
# boots, which writes a line to the NS16550 UART and halts. `mode`, `triple`,
# `entry` and `linker_script` are stage 4's `[target]` section
# (`plan/freestanding.md`); `panic` routes the compiler's own overflow and
# bounds checks to `kp_panic` in the entry module instead of the generated
# infinite loop, so a fault prints something before it wedges.
[target]
mode = "freestanding"
triple = "riscv64-unknown-none-elf"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

# The audit list (stage 1, `plan/unsafe-and-pointers.md`): only `uart` contains
# `unsafe`, and that is the one module that talks to the device register.
[unsafe]
modules = ["uart"]

# Kernel stage 16's mmio grant: the NS16550's register window, held by the
# entry module and delegated to `uart`, the one module that builds a pointer
# from the device's address (`plan/device-caps.md`).
[caps]
mmio = ["0x10000000+0x100"]
