name = "kernel0_aarch64"

# Kernel stage 10, "kernel 0 on a second architecture": a bare-metal aarch64
# image QEMU's `virt` machine boots, which writes a line to the PL011 UART and
# halts. `mode`, `triple`, `entry` and `linker_script` are stage 4's `[target]`
# section (`plan/freestanding.md`); `panic` routes the compiler's own overflow
# and bounds checks to `kp_panic` in the entry module instead of the generated
# infinite loop, so a fault prints something before it wedges.
[target]
mode = "freestanding"
triple = "aarch64-unknown-none"
entry = "kmain"
linker_script = "kernel.ld"
panic = "kp_panic"

# The audit list (stage 1, `plan/unsafe-and-pointers.md`): only `uart` contains
# `unsafe`, and that is the one module that talks to the device register.
[unsafe]
modules = ["uart"]
